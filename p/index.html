<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>관리자</title>
<link rel="stylesheet" href="../assets/admin.css">
<style>
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .shot { border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; background: #fff; }
  .shot a.pic { display: block; background: #f3f4f6; }
  .shot img { width: 100%; height: 170px; object-fit: cover; display: block; }
  .shot .meta { padding: 8px 10px; font-size: 11.5px; color: #6b7280; line-height: 1.5; }
  .shot .row2 { display: flex; gap: 6px; padding: 0 10px 10px; }
  .shot .row2 button, .shot .row2 a {
    flex: 1; text-align: center; padding: 6px 0; border-radius: 7px;
    font-size: 11.5px; text-decoration: none; cursor: pointer;
    border: 1px solid #d1d5db; color: #374151; background: #fff;
  }
  .shot .row2 .del { color: #b91c1c; border-color: #fecaca; }
  .empty { color: #6b7280; font-size: 14px; }
  /* 남은 용량 막대 */
  .bar { margin-top: 7px; height: 9px; border-radius: 5px; background: #e5e7eb; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #2563eb; transition: width .3s; }
  .bar.warn i { background: #d97706; }
  .bar.full i { background: #dc2626; }
</style>
</head>
<body>

<div class="login card" id="login">
  <h1 id="title"></h1>
  <p class="sub">관리자 코드를 넣어 주세요.</p>
  <div class="row">
    <input id="code" type="password" inputmode="text" autocomplete="off"
           autocapitalize="off" spellcheck="false" placeholder="관리자 코드">
    <button id="go">열기</button>
  </div>
  <p class="err hidden" id="err"></p>
</div>

<div class="wrap hidden" id="panel">

  <div class="row-between">
    <div>
      <h1>영수증</h1>
      <p class="sub"><span class="tag" id="title2"></span> <span id="updated"></span></p>
    </div>
    <div class="row">
      <button class="ghost" id="refresh">새로 고침</button>
      <button class="ghost" id="logout">나가기</button>
    </div>
  </div>

  <div class="card">
    <h2>한눈에</h2>
    <div class="stats" id="stats"></div>

    <div id="gauge" style="margin-top:18px">
      <div class="row-between" style="font-size:12.5px;color:#374151">
        <span id="gauge-left"></span><span id="gauge-right"></span>
      </div>
      <div class="bar"><i id="gauge-fill"></i></div>
      <p class="sub" id="gauge-note" style="margin-top:8px"></p>
    </div>

    <p class="sub" style="margin-top:14px">
      올라온 영수증은 <b id="keep">한 달</b> 뒤 저절로 지워집니다. 그전에 받아 두세요.
    </p>
    <div class="row" style="margin-top:16px;flex-wrap:wrap;gap:8px">
      <button class="ghost" id="csv">목록 엑셀로 받기</button>
      <button class="ghost" id="all">보이는 것 모두 받기</button>
    </div>
  </div>

  <div class="card">
    <h2>올라온 영수증</h2>
    <p class="sub" id="sum"></p>
    <div id="shots" class="shots" style="margin-top:16px"></div>
    <p class="empty hidden" id="empty">아직 올라온 영수증이 없습니다.</p>
  </div>

</div>

<script src="../assets/padmin.js?v=2"></script>
</body>
</html>
