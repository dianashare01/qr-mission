<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12271B">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<title>KOREA, CHECK-IN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 한국관광공사 하이커그라운드 QR 스탬프 투어
   가이드 v0.2 의 화면 순서를 그대로 따릅니다.
   색과 모양은 가이드에서 뽑은 임시값이고, 최종 디자인이 오면 이 파일만 고치면 됩니다. */

:root {
  --bg: #12271B;
  --card: #1C3A28;
  --ink: #F2EDE1;
  --ink-sub: #9DB2A3;
  --gold: #D6B35F;
  --gold-light: #EBD79B;
  --wood: #6A4D3B;
  --line: #2C4A36;

  --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --serif: 'Noto Serif', Georgia, serif;
  --mono: ui-monospace, 'SFMono-Regular', Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  min-height: 100%;
  background: #0A1711;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { display: block; max-width: 100%; }

#app {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100dvh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* ── 맨 위 띠: 좌 문체부 · 우 한국관광공사 ───────── */
.ci {
  flex: none;
  height: 34px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ci i {
  display: block;
  width: 46px;
  height: 11px;
  border-radius: 2px;
  background: #2E5B3F;
}

/* ── 단계 표기 (n / 7 + 점) ───────────────────── */
.steps { flex: none; padding: 6px 0 14px; text-align: center; }
.steps .n { font-family: var(--mono); font-size: 15px; letter-spacing: .08em; color: var(--ink); }
.steps .n b { color: var(--gold); font-weight: 700; }
.steps .dots { display: flex; justify-content: center; gap: 7px; margin-top: 7px; }
.steps .dots i { width: 6px; height: 6px; border-radius: 50%; background: #2B4433; }
.steps .dots i.on { background: var(--gold); }

/* ── NEXT 안내 ──────────────────────────────── */
.nextline { flex: none; padding: 0 20px 12px; }
.nextline .k { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--gold); }
.nextline .v { font-size: 13.5px; color: var(--gold-light); }

/* ── 본문 ───────────────────────────────────── */
.main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 8px 24px 16px;
  animation: fade .24s ease both;
}
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.grow { flex: 1; }
.center { text-align: center; }

/* ── 키카드 ─────────────────────────────────── */
.key {
  flex: none;
  width: 182px;
  border-radius: 10px 10px 8px 8px;
  overflow: hidden;
  box-shadow: 0 16px 34px rgba(0, 0, 0, .42);
}
.key .top { height: 26px; background: var(--wood); }
.key .body {
  height: 232px;
  background: var(--card);
  display: grid;
  place-items: center;
  position: relative;
}
.key .body::after {
  content: '';
  position: absolute;
  left: 50%; bottom: 14px;
  width: 52px; height: 3px;
  margin-left: -26px;
  border-radius: 2px;
  background: rgba(255, 255, 255, .14);
}
.key svg { width: 86px; height: 132px; }
.key.gold .body { background: linear-gradient(150deg, var(--gold-light), var(--gold) 55%, #B8923F); }
.key.gold svg { opacity: .55; }

/* ── 스탬프 일곱 칸 ─────────────────────────── */
.stamps { flex: none; display: flex; gap: 9px; justify-content: center; }
.stamps .s {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1.5px solid #3A5C45;
  display: grid; place-items: center;
  font-family: var(--serif);
  font-size: 14px;
  color: transparent;
}
.stamps .s.on {
  border-color: transparent;
  background: radial-gradient(circle at 34% 30%, var(--gold-light), var(--gold) 62%, #A8812F);
  color: #3A2C0C;
  box-shadow: 0 0 14px rgba(214, 179, 95, .35);
}
.stamps .s.pop { animation: pop .5s cubic-bezier(.2, .9, .3, 1.35) both; }
@keyframes pop { from { transform: scale(.55); opacity: 0 } to { transform: scale(1); opacity: 1 } }

/* 도장 찍히는 연출 (0.8초) */
.press {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  background: rgba(10, 23, 17, .82);
}
.press svg { width: 128px; height: 128px; animation: press .8s cubic-bezier(.3, 1.4, .4, 1) both; }
@keyframes press {
  0% { transform: translateY(-62px) scale(1.25); opacity: 0 }
  45% { transform: translateY(0) scale(1); opacity: 1 }
  70% { transform: translateY(-9px) scale(1) }
  100% { transform: translateY(0) scale(1); opacity: 1 }
}

/* ── 글 ─────────────────────────────────────── */
h1 { font-family: var(--serif); font-size: 26px; font-weight: 700; line-height: 1.25; letter-spacing: .01em; }
.wordmark { font-family: var(--serif); font-size: 13px; letter-spacing: .26em; color: var(--ink); }
.title-sm { font-size: 14px; font-weight: 700; letter-spacing: .18em; }
.sub { font-size: 13.5px; color: var(--ink-sub); }
.gold { color: var(--gold); }

/* ── 단추 ───────────────────────────────────── */
.btn {
  flex: none;
  width: 100%;
  min-height: 52px;
  padding: 12px 18px;
  border-radius: 26px;
  background: linear-gradient(180deg, var(--gold-light), var(--gold));
  color: #2A2008;
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: .06em;
  text-align: center;
}
.btn.ghost { background: none; border: 1.5px solid var(--line); color: var(--ink); font-weight: 500; }

/* ── 아래 줄 (뒤로 · 행사명 · NEXT) ─────────── */
.bottom {
  flex: none;
  height: 56px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.bottom .ico {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 50%;
  color: var(--ink-sub);
}
.bottom .ico svg { width: 19px; height: 19px; }
.bottom .ico.on { color: var(--gold); }
.bottom .wm { font-family: var(--serif); font-size: 11px; letter-spacing: .2em; color: var(--ink-sub); text-align: center; line-height: 1.3; }
.bottom .wm b { display: block; font-size: 12.5px; letter-spacing: .14em; color: var(--ink); }

/* ── 언어 고르기 ────────────────────────────── */
.langs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.lang {
  min-height: 42px;
  padding: 0 16px;
  border: 1.5px solid var(--line);
  border-radius: 21px;
  font-size: 13px;
}
.lang[aria-pressed="true"] { border-color: var(--gold); background: rgba(214, 179, 95, .14); color: var(--gold-light); font-weight: 700; }

/* ── 이름 적기 ──────────────────────────────── */
.field { width: 100%; display: flex; flex-direction: column; gap: 7px; }
.field label { font-size: 12px; font-weight: 700; color: var(--ink-sub); }
.field input {
  height: 52px;
  padding: 0 16px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: #16301F;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
}
.field input:focus { outline: none; border-color: var(--gold); }
.err { min-height: 20px; font-size: 12.5px; color: #E0A07A; }

/* ── QR 찍는 화면 ───────────────────────────── */
.finder {
  position: relative;
  width: 214px; height: 214px;
  flex: none;
  border-radius: 10px;
  background: #0E2117;
}
.finder i {
  position: absolute;
  width: 34px; height: 34px;
  border: 2.5px solid var(--gold);
}
.finder i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
.finder i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
.finder i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
.finder i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
.finder .beam {
  position: absolute;
  left: 10px; right: 10px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  animation: sweep 1.9s ease-in-out infinite;
}
@keyframes sweep { 0%, 100% { top: 14% } 50% { top: 84% } }

/* ── 체크아웃 코드 ──────────────────────────── */
.code {
  font-family: var(--mono);
  font-size: 19px;
  letter-spacing: .16em;
  color: var(--gold-light);
  padding: 10px 16px;
  border: 1px dashed var(--line);
  border-radius: 8px;
}

/* ── 성수 · 신촌 ────────────────────────────── */
.annex { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.annex .row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #16301F;
  text-align: left;
}
.annex .row .lb { flex: 1; }
.annex .row .lb b { display: block; font-size: 13px; letter-spacing: .14em; }
.annex .row .lb span { font-size: 12px; color: var(--ink-sub); }
.annex .row .chev { color: var(--ink-sub); }

.poster { width: 100%; }
.poster img { width: 100%; border-radius: 10px; }

/* ── 알림 ───────────────────────────────────── */
.toast {
  position: absolute;
  left: 20px; right: 20px; top: 54px;
  z-index: 40;
  padding: 13px 16px;
  border-radius: 10px;
  background: #0B1C13;
  border: 1px solid var(--line);
  color: var(--ink);
  font-size: 13.5px;
  text-align: center;
}

[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

<div id="app"></div>

<script src="../assets/stamp.js"></script>
</body>
</html>
