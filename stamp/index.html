<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D2B20">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<title>KOREA, CHECK-IN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* KOREA, CHECK-IN — QR 스탬프 투어
   디자인 시안(01 첫 화면 · 02 단계별 화면 · 03 카메라 스캔 · 07 성수·신촌)을 따릅니다.
   그림은 assets/stamp/ 에, 문구와 거점은 config/kcheckin.json 에 있습니다. */

:root {
  --bg: #0D2B20;
  --gold: #C9A961;
  --gold-light: #F0DE9E;
  --gold-deep: #A8873F;
  --ink: #F2F0E9;
  --ink-sub: #9FB3A6;
  --bar-off: #2A4B38;
  --ring: #3E5C48;
  --paper: #F2F0E9;
  --paper-ink: #163123;

  --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  min-height: 100%;
  background: #071A12;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { display: block; max-width: 100%; }

#app {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100dvh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* ── 기관 표기 ─────────────────────────────────── */
.ci {
  flex: none;
  padding: 18px 20px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.ci img { height: 22px; width: auto; opacity: .95; }

/* ── YOUR STAMP JOURNEY + n / 7 ────────────────── */
.journey {
  flex: none;
  padding: 16px 20px 0;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.journey .lb { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; }
.journey .ct { font-size: 13px; letter-spacing: .06em; color: var(--ink-sub); }
.journey .ct b { color: var(--gold-light); font-weight: 700; }

/* 일곱 칸 막대 */
.bars { flex: none; padding: 9px 20px 0; display: flex; gap: 6px; }
.bars i { flex: 1; height: 3px; border-radius: 2px; background: var(--bar-off); }
.bars i.on { background: linear-gradient(90deg, var(--gold-deep), var(--gold-light)); }

/* ── 본문 ──────────────────────────────────────── */
.main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 20px 24px 10px;
  animation: fade .24s ease both;
}
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.grow { flex: 1; }
.center { text-align: center; }

/* ── 룸키 ──────────────────────────────────────── */
.card { flex: none; width: 172px; filter: drop-shadow(0 16px 30px rgba(0, 0, 0, .38)); }
.card.sm { width: 132px; }

/* ── NEXT 알약 ─────────────────────────────────── */
.nextpill {
  flex: none;
  max-width: 100%;
  padding: 8px 18px;
  border-radius: 999px;
  background: var(--paper);
  color: var(--paper-ink);
  font-size: 13px;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.nextpill b { font-weight: 700; }

/* ── 스탬프 일곱 칸 ─────────────────────────────── */
.stamps { flex: none; display: flex; gap: 7px; justify-content: center; }
.stamps .s {
  width: 38px; height: 38px;
  border-radius: 50%;
  border: 1.5px solid var(--ring);
  display: grid; place-items: center;
  overflow: hidden;
}
.stamps .s.on { border: 0; }
.stamps .s img { width: 100%; height: 100%; object-fit: contain; }
.stamps .s.pop img { animation: pop .5s cubic-bezier(.2, .9, .3, 1.35) both; }
@keyframes pop { from { transform: scale(.5); opacity: 0 } to { transform: scale(1); opacity: 1 } }

/* ── 단추 ──────────────────────────────────────── */
.btn {
  flex: none;
  width: 100%;
  min-height: 54px;
  padding: 12px 18px;
  border-radius: 999px;
  background: linear-gradient(100deg, #CBA85E, #F0DE9E 45%, #C49E4F);
  color: #2A2107;
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: .04em;
  text-align: center;
}

/* ── 아래 길잡이 ───────────────────────────────── */
.nav {
  flex: none;
  padding: 10px 24px calc(18px + env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.nav .ico {
  width: 44px; height: 44px;
  flex: none;
  display: grid; place-items: center;
  border: 1px solid var(--ring);
  border-radius: 50%;
  color: var(--gold-light);
}
.nav .ico svg { width: 18px; height: 18px; }
.nav .ico.off { visibility: hidden; }
.nav .mark { height: 34px; width: auto; opacity: .95; }

/* ── 첫 화면 ───────────────────────────────────── */
.bigmark { flex: none; width: 152px; }
.h-title { font-size: 25px; font-weight: 700; letter-spacing: .02em; }
.sub { font-size: 14px; color: var(--ink-sub); }

/* ── 언어 ──────────────────────────────────────── */
.langs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.lang {
  min-height: 42px; padding: 0 16px;
  border: 1px solid var(--ring);
  border-radius: 999px;
  font-size: 13px;
  color: var(--ink);
}
.lang[aria-pressed="true"] {
  border-color: var(--gold);
  background: rgba(201, 169, 97, .16);
  color: var(--gold-light);
  font-weight: 700;
}

/* ── 이름 적기 ─────────────────────────────────── */
.field { width: 100%; display: flex; flex-direction: column; gap: 7px; }
.field label { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; color: var(--ink-sub); }
.field input {
  height: 54px; padding: 0 18px;
  border: 1px solid var(--ring);
  border-radius: 12px;
  background: #0A2419;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
}
.field input:focus { outline: none; border-color: var(--gold); }
.err { min-height: 20px; font-size: 12.5px; color: #E6B98A; }

/* ── 체크아웃 ──────────────────────────────────── */
.code {
  font-family: var(--mono);
  font-size: 18px;
  letter-spacing: .16em;
  color: var(--gold-light);
  padding: 9px 16px;
  border: 1px dashed var(--ring);
  border-radius: 10px;
}
.thanks {
  flex: none;
  padding: 10px 20px;
  border-radius: 999px;
  background: var(--paper);
  color: var(--paper-ink);
  font-size: 14px;
  font-weight: 500;
}

/* ── 성수 · 신촌 ───────────────────────────────── */
.annex { width: 100%; display: flex; flex-direction: column; gap: 12px; }
.annex .row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 18px;
  border: 1px solid var(--ring);
  border-radius: 14px;
  text-align: left;
}
.annex .row .lb { flex: 1; min-width: 0; }
.annex .row .lb b { display: block; font-size: 15px; font-weight: 700; letter-spacing: .04em; color: var(--gold-light); }
.annex .row .lb span { font-size: 12.5px; color: var(--ink-sub); }
.annex .row .arr { flex: none; color: var(--gold-light); }
.annex .row .arr svg { width: 20px; height: 20px; }
.sectitle { align-self: flex-start; font-size: 13px; font-weight: 700; letter-spacing: .1em; }

.poster { width: 100%; }
.poster img { width: 100%; border-radius: 12px; }

/* ── 도장 찍히는 연출 ─────────────────────────────
   디자이너가 준 0.8초 영상을 그림 스무 장으로 펼쳐 한 칸씩 넘깁니다.
   투명 webm 은 아이폰 사파리에서 뒤가 까맣게 나와 쓰지 못합니다. */
.press {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  background: rgba(7, 26, 18, .65);   /* 뒤 화면이 비쳐 보이게 */
}
/* 도장이 화면 가로의 약 63%, 중심이 위쪽 45% 에 오도록 (시안 기준) */
.press .anim {
  width: 157%;
  aspect-ratio: 1;
  transform: translateY(-18.6%);
  background-image: url('../assets/stamp/press.webp');
  background-repeat: no-repeat;
  background-size: 500% 400%;
  animation: stamping .8s step-end forwards;
}
@keyframes stamping {
  0% { background-position: 0% 0%; }
  5% { background-position: 25% 0%; }
  10% { background-position: 50% 0%; }
  15% { background-position: 75% 0%; }
  20% { background-position: 100% 0%; }
  25% { background-position: 0% 33.3333%; }
  30% { background-position: 25% 33.3333%; }
  35% { background-position: 50% 33.3333%; }
  40% { background-position: 75% 33.3333%; }
  45% { background-position: 100% 33.3333%; }
  50% { background-position: 0% 66.6667%; }
  55% { background-position: 25% 66.6667%; }
  60% { background-position: 50% 66.6667%; }
  65% { background-position: 75% 66.6667%; }
  70% { background-position: 100% 66.6667%; }
  75% { background-position: 0% 100%; }
  80% { background-position: 25% 100%; }
  85% { background-position: 50% 100%; }
  90% { background-position: 75% 100%; }
  95% { background-position: 100% 100%; }
}

/* ── 알림 ──────────────────────────────────────── */
.toast {
  position: absolute;
  left: 20px; right: 20px; top: 70px;
  z-index: 40;
  padding: 13px 16px;
  border-radius: 12px;
  background: var(--paper);
  color: var(--paper-ink);
  font-size: 13.5px;
  text-align: center;
  box-shadow: 0 10px 26px rgba(0, 0, 0, .35);
}

[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

<div id="app"></div>

<script src="../assets/stamp.js"></script>
</body>
</html>
