<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>관리자</title>
<link rel="stylesheet" href="../assets/admin.css">
</head>
<body>

<!-- 들어가기 — 코드만 넣으면 됩니다 -->
<div class="login card" id="login">
  <h1 id="title"></h1>
  <p class="sub">관리자 코드를 넣어 주세요.</p>
  <div class="row">
    <input id="code" type="password" inputmode="text" autocomplete="off"
           autocapitalize="off" spellcheck="false" placeholder="관리자 코드">
    <button id="go">열기</button>
  </div>
  <p class="err hidden" id="err"></p>
</div>

<!-- 본문 -->
<div class="wrap hidden" id="panel">

  <div class="row-between">
    <div>
      <h1>관리자</h1>
      <p class="sub"><span class="tag" id="title2"></span> <span id="updated"></span></p>
    </div>
    <div class="row">
      <button class="ghost" id="refresh">새로 고침</button>
      <button class="ghost" id="logout">나가기</button>
    </div>
  </div>

  <div class="card">
    <h2>한눈에</h2>
    <div class="stats" id="stats"></div>
    <p class="sub" id="since" style="margin-top:12px"></p>
  </div>

  <div class="card">
    <h2>엑셀로 받기</h2>
    <p class="sub">단추를 누르면 바로 내려받습니다. 엑셀에서 그대로 열립니다.</p>
    <div class="row" style="margin-top:16px;flex-wrap:wrap;gap:8px">
      <button class="ghost" id="csv-sessions">이름 목록</button>
      <button class="ghost" id="csv-visits">다녀간 수</button>
      <button class="ghost" id="csv-stats">한눈에 보기</button>
    </div>
  </div>

  <div class="card hidden" id="who-card">
    <h2>들어온 분들</h2>
    <p class="sub" id="who-sum"></p>
    <div class="scroll" style="margin-top:12px"><table id="who-table"></table></div>
  </div>

  <div class="card hidden" id="spot-card">
    <h2>정류장별 도장</h2>
    <div class="scroll"><table id="spot-table"></table></div>
  </div>

  <div class="card hidden" id="day-card">
    <h2>날짜별 다녀간 수</h2>
    <p class="sub">「사람 수」는 그 브라우저가 그날 처음 들어온 경우만 셉니다.</p>
    <div class="scroll" style="margin-top:12px"><table id="day-table"></table></div>
  </div>

</div>

<script>
  window.ADMIN_PROJECT = 'kcheckin';
  window.ADMIN_SITE = 'kcheckin';
  window.ADMIN_TITLE = 'KOREA, CHECK-IN';
</script>
<script src="../assets/kadmin.js"></script>
</body>
</html>
