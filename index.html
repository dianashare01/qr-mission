<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141A26">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<title>증언: 다음 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/engine.css">
</head>
<body>

<div class="app">

  <div class="bar">
    <div class="brand" id="brand"></div>
    <div class="count" id="bar-count"></div>
  </div>

  <!-- ══ 01 시작 ══════════════════════════════════ -->
  <section class="screen" id="s-start">
    <div class="placeholder hero">키비주얼 영역 [디자이너] · 나비·꽃 이미지 사용 금지</div>
    <h1 class="h-start" id="start-title"></h1>
    <p class="sub" id="start-body"></p>

    <div class="field">
      <label for="nick" id="nick-label"></label>
      <input id="nick" type="text" maxlength="10" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="err" id="nick-err"></div>
    </div>

    <div class="spacer"></div>
    <button class="cta" id="start-cta"></button>
    <p class="note center" id="privacy-note"></p>
  </section>

  <!-- ══ 02 기록 확인 (지식) ══════════════════════ -->
  <section class="screen" id="s-knowledge">
    <div class="meta" id="k-place"></div>
    <div class="row">
      <div class="eyebrow" id="k-label"></div>
      <div class="meta">1 / 2</div>
    </div>
    <h1 class="h-q" id="k-q"></h1>
    <div class="options" id="k-options"></div>
    <div class="spacer"></div>
    <button class="cta" id="k-cta" disabled></button>
  </section>

  <!-- ══ 03 해설 ══════════════════════════════════ -->
  <section class="screen" id="s-feedback">
    <div class="meta" id="f-place"></div>
    <div class="eyebrow" id="f-label"></div>
    <h1 class="h-mid" id="f-title"></h1>
    <div class="box lg">
      <div class="k" id="f-k"></div>
      <div class="v-lg" id="f-v"></div>
      <p id="f-text"></p>
    </div>
    <p class="note" id="f-note">해설 문구는 전시 텍스트 최종본·자문 감수 후 확정</p>
    <div class="spacer"></div>
    <button class="cta" id="f-cta"></button>
  </section>

  <!-- ══ 04 나의 생각 (취향) ══════════════════════ -->
  <section class="screen" id="s-preference">
    <div class="meta" id="p-place"></div>
    <div class="row">
      <div class="eyebrow" id="p-label"></div>
      <div class="meta">2 / 2</div>
    </div>
    <h1 class="h-q" id="p-q"></h1>
    <div class="options" id="p-options"></div>
    <div class="spacer"></div>
    <button class="cta" id="p-cta" disabled></button>
  </section>

  <!-- ══ 05 획득 ══════════════════════════════════ -->
  <section class="screen" id="s-collect">
    <div style="height:12px;flex:none"></div>
    <div class="item-card">
      <div class="name" id="c-name"></div>
      <div class="place" id="c-place"></div>
      <div class="cap" id="c-cap"></div>
    </div>
    <h1 class="h-mid center" id="c-title"></h1>
    <p class="sub center" id="c-note"></p>
    <div class="spacer"></div>
    <button class="cta" id="c-cta"></button>
  </section>

  <!-- ══ 06 수집 보드 ═════════════════════════════ -->
  <section class="screen" id="s-board" style="gap:16px">
    <h1 class="h-mid" id="b-title"></h1>
    <div class="sub" id="b-count" style="font-size:15px"></div>
    <div class="grid" id="b-grid"></div>

    <div class="box" id="b-next">
      <div class="k" id="b-next-label"></div>
      <div class="v" id="b-next-value"></div>
    </div>

    <p class="note" id="b-free"></p>

    <div class="recovery">
      <span id="b-rec-label"></span><b id="b-rec-code"></b>
    </div>
    <p class="note" id="b-rec-note"></p>

    <div class="spacer"></div>
    <button class="cta" id="b-cta"></button>
  </section>

  <!-- ══ 07 결과 ══════════════════════════════════ -->
  <section class="screen" id="s-result">
    <div class="eyebrow-plain" id="r-eyebrow"></div>
    <h1 class="h-big" id="r-name"></h1>
    <p class="sub" id="r-desc" style="color:var(--ink)"></p>
    <div class="placeholder card">결과 카드 영역 [디자이너] · 저장용 1080×1920</div>

    <div class="v" id="r-curation-title" style="margin-top:4px;font-size:13px"></div>
    <div class="curation" id="r-curation"></div>

    <div class="spacer"></div>
    <button class="cta" id="r-cta"></button>
    <button class="cta-ghost" id="r-save"></button>
  </section>

  <!-- ══ 08 마무리 ════════════════════════════════ -->
  <section class="screen" id="s-finish">
    <div class="eyebrow" id="fin-badge"></div>
    <h1 class="h-mid" id="fin-title"></h1>
    <p class="sub" id="fin-body"></p>
    <div class="options" id="fin-options"></div>
    <p class="note" id="fin-note"></p>
    <div class="spacer"></div>
    <button class="cta" id="fin-cta" disabled></button>
  </section>

  <!-- ══ 안내 (중복 스캔 · 잘못된 QR · 기간 종료) ══ -->
  <section class="screen" id="s-notice">
    <div style="height:40px;flex:none"></div>
    <h1 class="h-mid" id="n-title"></h1>
    <p class="sub" id="n-body"></p>
    <div class="spacer"></div>
    <button class="cta" id="n-cta">모아 보기로</button>
  </section>

</div>

<script src="assets/engine.js"></script>
</body>
</html>
