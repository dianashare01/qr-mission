<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A17">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<title>증언: 다음 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 글꼴은 설정 파일(theme.fonts)을 보고 engine.js 가 불러옵니다 -->
<script>
/* 인쇄한 QR 은 모두 이 쪽으로 들어옵니다.
   스탬프 투어로 만든 전시는 전용 화면으로 넘겨 줍니다.
   (주소에 담긴 s·t 는 그대로 넘깁니다) */
(function () {
  var STAMP = { kcheckin: 1 };
  var p = new URLSearchParams(location.search).get("p");
  if (p && STAMP[p]) location.replace("stamp/" + location.search);
})();
</script>
<link rel="stylesheet" href="assets/engine.css">
</head>
<body>

<div class="app">

  <div class="bar">
    <div class="brand-wrap">
      <svg class="book" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h6a3 3 0 0 1 3 3v11a2.5 2.5 0 0 0-2.5-2.5H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v11a2.5 2.5 0 0 1 2.5-2.5H21z"/></svg>
      <div class="brand" id="brand"></div>
    </div>
  </div>

  <!-- ══ 01 시작 ══════════════════════════════════ -->
  <section class="screen" id="s-start" style="gap:14px">
    <div class="eyebrow-plain" id="st-eyebrow"></div>
    <h1 class="h-mid lines" id="start-title"></h1>
    <div class="sub lines" id="start-body"></div>
    <div class="steps" id="st-steps"></div>

    <div class="field">
      <label for="nick" id="nick-label"></label>
      <input id="nick" type="text" maxlength="10" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="err" id="nick-err"></div>
    </div>

    <div class="spacer"></div>
    <button class="cta" id="start-cta"></button>
    <p class="note center" id="privacy-note"></p>
    <p class="foot lines" id="st-foot"></p>
  </section>

  <!-- ══ 02 기록 확인 (지식) ══════════════════════ -->
  <section class="screen qscreen" id="s-knowledge">
    <h1 class="quiz-head"></h1>
    <div class="sheet">
      <div class="sheet-place" id="k-place"></div>
      <div class="qno" id="k-label"></div>
      <h2 class="h-q" id="k-q"></h2>
      <div class="options" id="k-options"></div>
      <div class="spacer"></div>
      <p class="pick-hint" id="k-hint"></p>
    </div>
    <div class="pills"></div>
  </section>

  <!-- ══ 03 해설 ══════════════════════════════════ -->
  <section class="screen qscreen" id="s-feedback">
    <h1 class="quiz-head"></h1>
    <div class="sheet">
      <div class="sheet-place" id="f-place"></div>
      <div class="qno" id="f-label"></div>
      <h2 class="h-q" id="f-q"></h2>

      <!-- 고른 답과 기록에 적힌 답 -->
      <div class="options" id="f-rows"></div>

      <h3 class="f-title" id="f-title"></h3>
      <p class="f-text" id="f-text"></p>

      <div class="spacer"></div>
      <button class="cta" id="f-cta"></button>
    </div>
    <div class="pills"></div>
  </section>

  <!-- ══ 04 나의 생각 (취향) ══════════════════════ -->
  <section class="screen qscreen" id="s-preference">
    <h1 class="quiz-head"></h1>
    <div class="sheet">
      <div class="sheet-place" id="p-place"></div>
      <div class="qno qno-plain" id="p-label"></div>
      <h2 class="h-q" id="p-q"></h2>
      <div class="options" id="p-options"></div>
      <div class="spacer"></div>
      <p class="pick-hint" id="p-hint"></p>
    </div>
    <div class="pills"></div>
  </section>

  <!-- ══ 05 획득 ══════════════════════════════════ -->
  <section class="screen" id="s-collect">
    <div style="height:12px;flex:none"></div>
    <div class="item-card">
      <div class="name" id="c-name"></div>
      <div class="place" id="c-place"></div>
      <div class="cap" id="c-cap"></div>
    </div>
    <h1 class="h-mid center" id="c-title"></h1>
    <p class="sub center" id="c-note"></p>
    <div class="spacer"></div>
    <button class="cta" id="c-cta"></button>
    <button class="cta-ghost hidden" id="c-demo"></button>
  </section>

  <!-- ══ 06 퀴즈 목록 ═════════════════════════════ -->
  <section class="screen" id="s-board" style="gap:14px">
    <div class="eyebrow-plain" id="b-eyebrow"></div>
    <h1 class="h-mid lines" id="b-title"></h1>
    <div class="sub lines" id="b-count"></div>
    <div class="steps" id="b-steps"></div>
    <div class="grid" id="b-grid"></div>

    <div class="legend">
      <span><i class="done"></i><em id="b-legend-done"></em></span>
      <span><i class="todo"></i><em id="b-legend-todo"></em></span>
    </div>

    <div class="box" id="b-next">
      <div class="k" id="b-next-label"></div>
      <div class="v" id="b-next-value"></div>
    </div>

    <p class="note" id="b-free"></p>
    <p class="note hidden" id="b-demo-note">시연용: 아직 안 연 페이지를 누르면 그 QR을 찍은 것으로 처리됩니다.</p>

    <div class="recovery">
      <span id="b-rec-label"></span><b id="b-rec-code"></b>
    </div>
    <p class="note" id="b-rec-note"></p>
    <button class="cta-ghost hidden" id="b-restore"></button>

    <button class="cta" id="b-cta" style="margin-top:6px"></button>
    <p class="foot lines" id="b-foot"></p>
  </section>

  <!-- ══ 07 결과 ══════════════════════════════════ -->
  <section class="screen" id="s-result">
    <div class="eyebrow-plain" id="r-eyebrow"></div>
    <h1 class="h-big" id="r-name"></h1>
    <p class="sub" id="r-desc" style="color:var(--ink)"></p>

    <!-- AI 시 (박인환) — 설정에 poem 이 있을 때만 보입니다 -->
    <div class="box lg hidden" id="r-poem">
      <div class="k" id="r-poem-label"></div>
      <div class="poem" id="r-poem-text"></div>
    </div>

    <div class="v" id="r-curation-title" style="margin-top:4px;font-size:13px"></div>
    <div class="curation" id="r-curation"></div>

    <div class="spacer"></div>
    <div class="sticky-cta">
      <button class="cta" id="r-cta"></button>
    </div>
  </section>

  <!-- ══ 08 마무리 ════════════════════════════════ -->
  <section class="screen" id="s-finish">
    <div class="eyebrow" id="fin-badge"></div>
    <h1 class="h-mid" id="fin-title"></h1>
    <p class="sub" id="fin-body"></p>
    <div class="options" id="fin-options"></div>
    <p class="note" id="fin-note"></p>

    <!-- 앞서 다녀간 분들의 기록 -->
    <div class="hidden" id="fin-recent">
      <div class="eyebrow-plain" id="fin-recent-label"></div>
      <div class="recent-list" id="fin-recent-list"></div>
    </div>
    <div class="spacer"></div>
    <div class="sticky-cta">
      <button class="cta" id="fin-cta" disabled></button>
    </div>
  </section>

  <!-- ══ 안내 (중복 스캔 · 잘못된 QR · 기간 종료) ══ -->
  <section class="screen" id="s-notice">
    <div style="height:40px;flex:none"></div>
    <h1 class="h-mid" id="n-title"></h1>
    <p class="sub" id="n-body"></p>
    <div class="spacer"></div>
    <button class="cta" id="n-cta">모아 보기로</button>
    <button class="cta-ghost hidden" id="n-alt"></button>
  </section>

</div>

<script src="assets/engine.js"></script>
</body>
</html>
