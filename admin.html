<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>관리자 — QR 미션</title>
<style>
  :root { --bg:#F7F8FA; --card:#FFFFFF; --ink:#16181D; --sub:#5B6472; --line:#DDE1E8; --accent:#1D4ED8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:15px; line-height:1.6; padding:28px 20px 80px; }
  .wrap { max-width:960px; margin:0 auto; display:flex; flex-direction:column; gap:20px; }

  h1 { font-size:24px; }
  h2 { font-size:17px; margin-bottom:10px; }
  .sub { color:var(--sub); font-size:14px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; }

  .form { display:grid; grid-template-columns:1fr; gap:12px; }
  @media (min-width:720px) { .form { grid-template-columns:1fr 1fr auto; align-items:end; } }
  label { display:block; font-size:13px; font-weight:700; margin-bottom:6px; }
  input, select { width:100%; height:44px; padding:0 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; font-family:inherit; background:#fff; color:var(--ink); }
  button { height:44px; padding:0 20px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; white-space:nowrap; }
  button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:not-allowed; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:14px; }
  .stat .k { font-size:12px; color:var(--sub); }
  .stat .v { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--sub); background:#F1F3F6; }
  td.n { font-variant-numeric:tabular-nums; color:var(--sub); white-space:nowrap; }
  td.msg { font-weight:600; }
  .scroll { overflow-x:auto; }

  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .err { color:#B42318; font-size:14px; }
  .hidden { display:none; }
  .muted { color:var(--sub); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">

  <div>
    <h1>QR 미션 관리자</h1>
    <p class="sub">참여 통계와 남겨진 기록을 봅니다. 주소와 키는 이 브라우저에만 저장됩니다.</p>
  </div>

  <div class="card">
    <div class="form">
      <div>
        <label for="base">서버 주소</label>
        <input id="base" placeholder="https://qr-mission-api.계정.workers.dev" autocomplete="off">
      </div>
      <div>
        <label for="key">관리자 키 (ADMIN_KEY)</label>
        <input id="key" type="password" placeholder="wrangler secret 로 넣은 값" autocomplete="off">
      </div>
      <div>
        <button id="load">불러오기</button>
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <label for="project" style="margin:0">전시</label>
      <select id="project" style="width:auto">
        <option value="wianbu">위안부 — 증언: 다음 페이지</option>
        <option value="inje">박인환 — 마리서사</option>
        <option value="">전체</option>
      </select>
      <span class="muted" id="status"></span>
    </div>
    <p class="err hidden" id="err"></p>
  </div>

  <div class="card hidden" id="stats-card">
    <h2>참여 통계</h2>
    <div class="stats" id="stats"></div>
    <div class="row" style="margin-top:16px">
      <button class="ghost" id="csv-stats">통계 CSV 내려받기</button>
    </div>
  </div>

  <div class="card hidden" id="spot-card">
    <h2>스팟별 스캔</h2>
    <div class="scroll"><table id="spot-table"></table></div>
  </div>

  <div class="card hidden" id="type-card">
    <h2>유형 분포</h2>
    <div class="scroll"><table id="type-table"></table></div>
  </div>

  <div class="card hidden" id="msg-card">
    <h2>남겨진 기록</h2>
    <p class="sub" id="msg-sum"></p>
    <div class="scroll" style="margin-top:12px"><table id="msg-choice"></table></div>
    <div class="scroll" style="margin-top:20px"><table id="msg-table"></table></div>
    <div class="row" style="margin-top:16px">
      <button class="ghost" id="csv-msg">기록 CSV 내려받기</button>
    </div>
  </div>

</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  // 주소와 키는 이 브라우저에만 남깁니다
  try {
    $('base').value = localStorage.getItem('qrm-admin-base') || '';
    $('key').value = localStorage.getItem('qrm-admin-key') || '';
    $('project').value = localStorage.getItem('qrm-admin-project') || 'wianbu';
  } catch (e) {}

  function base() { return $('base').value.trim().replace(/\/+$/, ''); }
  function key() { return $('key').value.trim(); }
  function project() { return $('project').value; }

  function qs(extra) {
    var p = 'key=' + encodeURIComponent(key());
    if (project()) p += '&project=' + encodeURIComponent(project());
    return p + (extra || '');
  }

  function show(id, on) { $(id).classList.toggle('hidden', !on); }

  function table(el, head, rows) {
    var h = '<tr>' + head.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr>';
    var b = rows.map(function (r) {
      return '<tr>' + r.map(function (c, i) {
        var cls = typeof c === 'number' ? ' class="n"' : '';
        return '<td' + cls + '>' + String(c == null ? '' : c)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</td>';
      }).join('') + '</tr>';
    }).join('');
    el.innerHTML = h + b;
  }

  /* UTC 문자열을 한국 시간으로 */
  function kst(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', hour12: false });
  }

  function load() {
    if (!base() || !key()) { fail('서버 주소와 관리자 키를 모두 넣어 주세요.'); return; }

    try {
      localStorage.setItem('qrm-admin-base', base());
      localStorage.setItem('qrm-admin-key', key());
      localStorage.setItem('qrm-admin-project', project());
    } catch (e) {}

    $('load').disabled = true;
    $('status').textContent = '불러오는 중…';
    $('err').classList.add('hidden');

    Promise.all([
      fetch(base() + '/api/admin/stats?' + qs()).then(function (r) { return r.json(); }),
      fetch(base() + '/api/admin/messages?' + qs()).then(function (r) { return r.json(); }),
    ]).then(function (res) {
      $('load').disabled = false;
      var st = res[0], ms = res[1];

      if (!st || !st.ok) { fail((st && st.error) || '통계를 불러오지 못했습니다. 키를 확인해 주세요.'); return; }

      $('status').textContent = '마지막 갱신 ' + new Date().toLocaleTimeString('ko-KR');

      $('stats').innerHTML = [
        ['시작', st.started], ['완주', st.finished], ['완주율', st.completionRate + '%'],
        ['리워드 수령', st.redeemed], ['남긴 기록', st.messaged],
      ].map(function (s) {
        return '<div class="stat"><div class="k">' + s[0] + '</div><div class="v">' + s[1] + '</div></div>';
      }).join('');
      show('stats-card', true);

      table($('spot-table'), ['스팟', '스캔 수'], (st.bySpot || []).map(function (r) { return [r.spot_id, r.n]; }));
      show('spot-card', (st.bySpot || []).length > 0);

      table($('type-table'), ['유형', '인원'], (st.byType || []).map(function (r) { return [r.type_tag, r.n]; }));
      show('type-card', (st.byType || []).length > 0);

      if (ms && ms.ok) {
        $('msg-sum').textContent = '모두 ' + ms.total + '건' + (ms.total ? ' · 최근 것부터 보입니다' : '');
        table($('msg-choice'), ['고른 문장', '인원'],
          (ms.byMessage || []).map(function (r) { return [r.message, r.n]; }));
        table($('msg-table'), ['번호', '이름', '남긴 문장', '시각'],
          (ms.messages || []).map(function (r, i) {
            return [ms.total - i, r.nickname, r.message, kst(r.created_at)];
          }));
        show('msg-card', true);
      } else {
        show('msg-card', false);
      }
    }).catch(function (e) {
      $('load').disabled = false;
      fail('서버에 연결하지 못했습니다. 주소를 확인해 주세요. (' + e.message + ')');
    });
  }

  function fail(msg) {
    $('status').textContent = '';
    $('err').textContent = msg;
    $('err').classList.remove('hidden');
  }

  $('load').addEventListener('click', load);
  $('project').addEventListener('change', function () { if (base() && key()) load(); });

  $('csv-stats').addEventListener('click', function () {
    location.href = base() + '/api/admin/stats?' + qs('&format=csv');
  });
  $('csv-msg').addEventListener('click', function () {
    location.href = base() + '/api/admin/messages?' + qs('&format=csv');
  });
})();
</script>
</body>
</html>
